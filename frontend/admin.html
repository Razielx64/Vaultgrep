<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admin — vaultgrep</title>
<style>
  :root {
    --bg: #0e0e14;
    --panel: #1a1a22;
    --panel2: #14141c;
    --line: #2a2a38;
    --text: #d8d8e4;
    --dim: #8a8a9a;
    --accent: #4fd1c5;
    --green: #4fd1c5;
    --red: #e05252;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 4px;
  }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 0;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .name { font-size: 14px; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex: 0 0 auto;
    margin-left: 16px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: #2c2c3a;
    border-radius: 26px;
    cursor: pointer;
    transition: background .18s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .18s;
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .switch input:disabled + .slider { opacity: .35; cursor: not-allowed; }
  .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .badge.on { background: rgba(79,209,197,.12); color: var(--green); }
  .badge.off { background: rgba(224,82,82,.12); color: var(--red); }
  .badge.fixed { background: rgba(138,138,154,.12); color: var(--dim); }
  .status {
    text-align: right;
    color: var(--dim);
    font-size: 11px;
    min-height: 16px;
    margin-top: 16px;
  }
  .status.err { color: var(--red); }
  .status.ok { color: var(--green); }
</style>
</head>
<body>
<div class="wrap">
  <h1>admin</h1>
  <p class="sub">controle de funcionalidades — as abas continuam visíveis, a rota desativada responde 403.</p>

  <div class="card" id="list">
    <div class="row"><span class="name">carregando…</span></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const LABELS = {
  grep:  { name: 'grep / vault', hint: '/search' },
  cat:   { name: 'cat / leitor', hint: '/cat' },
  cpf:   { name: 'cpf',          hint: '/cpf · /graph · /cpf/resolver' },
  email: { name: 'email osint',  hint: '/email · /email/leaks' },
};
const FIXED = { name: 'ollama', hint: 'sempre ativo — não desativável' };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function status(msg, cls) {
  const s = document.getElementById('status');
  s.textContent = msg || '';
  s.className = 'status' + (cls ? ' ' + cls : '');
}

function render(features) {
  const list = document.getElementById('list');
  list.innerHTML = '';

  for (const key of Object.keys(LABELS)) {
    const meta = LABELS[key];
    const on = features[key] !== false;

    const row = el('div', 'row');
    const left = el('div');
    left.appendChild(el('div', 'name', meta.name));
    left.appendChild(el('div', 'hint', meta.hint));

    const right = el('div');
    right.style.display = 'flex';
    right.style.alignItems = 'center';
    right.style.gap = '12px';

    const badge = el('span', 'badge ' + (on ? 'on' : 'off'), on ? 'online' : 'offline');
    const sw = el('label', 'switch');
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.checked = on;
    inp.addEventListener('change', () => toggle(key, inp.checked, badge, inp));
    sw.appendChild(inp);
    sw.appendChild(el('span', 'slider'));

    right.appendChild(badge);
    right.appendChild(sw);
    row.appendChild(left);
    row.appendChild(right);
    list.appendChild(row);
  }

  // ollama — fixo, sempre online, sem switch
  const row = el('div', 'row');
  const left = el('div');
  left.appendChild(el('div', 'name', FIXED.name));
  left.appendChild(el('div', 'hint', FIXED.hint));
  const badge = el('span', 'badge on', 'online');
  row.appendChild(left);
  row.appendChild(badge);
  list.appendChild(row);
}

async function toggle(key, enabled, badge, inp) {
  inp.disabled = true;
  status('salvando…', null);
  try {
    const r = await fetch('/admin/features', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ feature: key, enabled }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    badge.textContent = enabled ? 'online' : 'offline';
    badge.className = 'badge ' + (enabled ? 'on' : 'off');
    status('salvo: ' + key + ' → ' + (enabled ? 'online' : 'offline'), 'ok');
  } catch (e) {
    inp.checked = !enabled;
    status('erro: ' + e.message, 'err');
  } finally {
    inp.disabled = false;
  }
}

(async () => {
  try {
    const r = await fetch('/admin/features');
    if (r.status === 401) { status('sem permissão admin', 'err'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data.features || {});
  } catch (e) {
    status('erro ao carregar: ' + e.message, 'err');
    render({});
  }
})();
</script>
</body>
</html>
