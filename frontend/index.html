<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAULTGREP.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Workbench · tone: technical · anchor hue: 295 · genre: atmospheric · theme: Terminal (polido)
 * Hallmark · pre-emit critique: P5 H4 E5 S4 R5 V4 */

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

@keyframes bar-load {
  0%, 100% { transform: scaleY(0.35); opacity: 0.4; }
  50% { transform: scaleY(1); opacity: 1; }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  /* ── paper / neutros — ancorados em violeta (hue 300) ── */
  --color-paper:      oklch(15%   0.012 300);
  --color-paper-2:    oklch(18.5% 0.012 300);
  --color-paper-3:    oklch(23%   0.012 300);
  --color-rule:       oklch(28%   0.012 300);
  --color-rule-2:     oklch(36%   0.012 300);
  --color-neutral:    oklch(55%   0.012 300);
  --color-muted:      oklch(68%   0.010 300);
  --color-ink-2:      oklch(82%   0.008 300);
  --color-ink:        oklch(94%   0.006 80);

  /* ── accent — violeta (hue 295) ── */
  --color-accent:        oklch(50% 0.20 295);
  --color-accent-hover:  oklch(56% 0.20 295);
  --color-accent-active: oklch(45% 0.20 295);
  --color-accent-soft:   oklch(72% 0.14 295);
  --color-accent-ink:    oklch(98% 0.01 295);
  --color-focus:         oklch(74% 0.16 295);

  /* ── status ── */
  --color-ok:           oklch(72% 0.16 155);
  --color-ok-bg:        oklch(72% 0.16 155 / 0.12);
  --color-ok-line:       oklch(72% 0.16 155 / 0.32);
  --color-err:          oklch(68% 0.19 25);
  --color-err-bg:       oklch(68% 0.19 25 / 0.12);
  --color-err-line:      oklch(68% 0.19 25 / 0.32);
  --color-loading:      oklch(72% 0.14 295);
  --color-loading-bg:   oklch(72% 0.14 295 / 0.12);
  --color-loading-line: oklch(72% 0.14 295 / 0.32);

  /* ── tipografia ── */
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* ── espaço (4pt) ── */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs:  0.5rem;
  --space-sm:  0.75rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2.5rem;
  --space-2xl: 4rem;

  /* ── escala de texto ── */
  --text-xs:   0.6875rem;
  --text-sm:   0.75rem;
  --text-base: 0.875rem;
  --text-md:   1rem;

  /* ── easing / duração ── */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long:  420ms;

  /* ── raio / z ── */
  --radius-sm: 3px;
  --radius-md: 6px;
  --z-base: 1;
  --z-raised: 10;
  --z-dropdown: 100;
}

html, body {
  height: 100%;
}

html { overflow-x: clip; }

body {
  overflow-x: clip;
  background:
    radial-gradient(40rem 40rem at 78% -12%, color-mix(in oklab, var(--color-accent) 16%, transparent), transparent 62%),
    var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-mono);
  font-size: var(--text-base);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--color-accent);
  color: var(--color-accent-ink);
}

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

/* ── HEADER ─────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-md);
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--color-rule);
  flex-shrink: 0;
}

.logo {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: var(--text-md);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-ink);
  display: inline-flex;
  align-items: baseline;
}

.logo-text {
  display: inline-block;
}

.logo-dot {
  color: var(--color-accent-soft);
  animation: blink 1.2s steps(1) infinite;
}

.header-right {
  display: inline-flex;
  align-items: center;
  gap: var(--space-md);
  flex-wrap: wrap;
}

/* MODE TABS — segmented control */
.mode-tabs {
  display: inline-flex;
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  background: var(--color-paper-2);
  overflow: hidden;
}

.mode-tab {
  height: 34px;
  padding: 0 var(--space-md);
  background: transparent;
  border: none;
  color: var(--color-muted);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
}

.mode-tab + .mode-tab {
  border-left: 1px solid var(--color-rule);
}

.mode-tab:hover {
  color: var(--color-ink);
  background: var(--color-paper-3);
}

.mode-tab:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: -2px;
  position: relative;
  z-index: var(--z-raised);
}

.mode-tab.active {
  background: var(--color-accent);
  color: var(--color-accent-ink);
}

.mode-tab.active:hover {
  background: var(--color-accent-hover);
  color: var(--color-accent-ink);
}

/* STATUS PILL */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  height: 34px;
  padding: 0 var(--space-md);
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--color-ink-2);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-ok);
  animation: pulse 2.4s var(--ease-in-out) infinite;
  flex-shrink: 0;
}

.status-pill.offline {
  color: var(--color-err);
  border-color: var(--color-err-line);
}

.status-pill.offline .status-dot {
  background: var(--color-err);
  animation: none;
}

/* ── MAIN ──────────────────────────────────────────── */
main {
  flex: 1;
  min-height: 0;
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  width: 100%;
}

/* SECTION LABEL */
.section-label {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--color-neutral);
}

/* SEARCH ROW */
.search-row {
  display: flex;
  align-items: stretch;
  gap: var(--space-sm);
}

.search-wrap {
  flex: 1;
  min-width: 0;
  position: relative;
}

#q {
  width: 100%;
  height: 44px;
  padding: 0 var(--space-md);
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  outline: 2px solid transparent;
  outline-offset: -2px;
  color: var(--color-ink);
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--text-base);
  letter-spacing: 0.01em;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}

#q::placeholder {
  color: var(--color-muted);
}

#q:hover {
  background: var(--color-paper-3);
}

#q:focus-visible {
  outline-color: var(--color-focus);
  border-color: var(--color-rule-2);
}

/* EXECUTE BUTTON */
#btn {
  height: 44px;
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: 0 var(--space-lg);
  background: var(--color-accent);
  color: var(--color-accent-ink);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.8125rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}

#btn:hover {
  background: var(--color-accent-hover);
}

#btn:active {
  background: var(--color-accent-active);
  transform: translateY(1px);
}

#btn:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

#btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-arrow {
  display: flex;
  align-items: center;
  transition: transform var(--dur-micro) var(--ease-out);
}

#btn:hover .btn-arrow {
  transform: translate(1px, -1px);
}

/* INFO ROW */
.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-xs);
  min-height: 22px;
}

#info {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--text-sm);
  color: var(--color-neutral);
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.streaming-word {
  color: var(--color-accent-soft);
}

/* STATUS TAG */
.status-tag {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  height: 24px;
  padding: 0 var(--space-sm);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
}

.status-tag.ok {
  color: var(--color-ok);
  border-color: var(--color-ok-line);
  background: var(--color-ok-bg);
}

.status-tag.err {
  color: var(--color-err);
  border-color: var(--color-err-line);
  background: var(--color-err-bg);
}

.status-tag.loading {
  color: var(--color-loading);
  border-color: var(--color-loading-line);
  background: var(--color-loading-bg);
}

/* BARS LOADER */
.bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}

.bars span {
  display: block;
  width: 3px;
  height: 100%;
  background: currentColor;
  transform-origin: bottom;
  animation: bar-load 0.8s var(--ease-in-out) infinite;
}

.bars span:nth-child(1) { animation-delay: 0s; }
.bars span:nth-child(2) { animation-delay: 0.1s; }
.bars span:nth-child(3) { animation-delay: 0.2s; }
.bars span:nth-child(4) { animation-delay: 0.3s; }
.bars span:nth-child(5) { animation-delay: 0.4s; }

/* RESULTS CARD */
.results-card {
  position: relative;
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

#cpb {
  position: absolute;
  top: var(--space-sm);
  right: var(--space-sm);
  z-index: var(--z-raised);
  display: none;
  height: 32px;
  padding: 0 var(--space-sm);
  background: var(--color-paper-3);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  color: var(--color-muted);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
}

#cpb::before {
  content: "";
  position: absolute;
  inset: -6px;
}

#cpb:hover {
  background: var(--color-paper-3);
  color: var(--color-ink);
  border-color: var(--color-rule-2);
}

#cpb:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

#cpb:active {
  transform: translateY(1px);
}

#cpb.copied {
  background: var(--color-accent);
  color: var(--color-accent-ink);
  border-color: var(--color-accent);
}

#orfr {
  height: 44px;
  width: 44px;
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--color-paper-3);
  border: 1px solid var(--color-rule-2);
  border-radius: var(--radius-sm);
  color: var(--color-ink-2);
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}

#orfr:hover {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-accent-ink);
}

#orfr:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

#orfr:active {
  transform: translateY(1px);
}

#orfr:active svg {
  transform: rotate(180deg);
}

#orfr svg {
  transition: transform var(--dur-short) var(--ease-out);
}

#out {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: var(--space-xl) var(--space-md) var(--space-lg);
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 0.8125rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--color-ink-2);
  font-variant-numeric: tabular-nums;
}

#out::-webkit-scrollbar { width: 4px; }
#out::-webkit-scrollbar-track { background: transparent; }
#out::-webkit-scrollbar-thumb { background: var(--color-rule-2); }

.ph {
  color: var(--color-muted);
}

/* PAGINATION */
#pg {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  flex-wrap: wrap;
}

.pg-btn {
  height: 36px;
  padding: 0 var(--space-md);
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  color: var(--color-muted);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-sm);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
}

.pg-btn:hover:not(:disabled) {
  color: var(--color-ink);
  border-color: var(--color-rule-2);
}

.pg-btn:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 2px;
}

.pg-btn:active:not(:disabled) {
  transform: translateY(1px);
}

.pg-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#pginfo {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--text-sm);
  color: var(--color-neutral);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}

/* ── FOOTER ─────────────────────────────────────────── */
footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-lg);
  border-top: 1px solid var(--color-rule);
  flex-shrink: 0;
}

.footer-brand {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--color-neutral);
}

#fc {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  color: var(--color-neutral);
  font-variant-numeric: tabular-nums;
}

/* ── CPF MODE ───────────────────────────────────────── */
.depth-select {
  height: 44px;
  padding: 0 var(--space-md);
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm);
  color: var(--color-ink);
  font-family: var(--font-mono);
  font-size: var(--text-base);
  cursor: pointer;
  flex-shrink: 0;
  display: none;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}

.depth-select:hover {
  background: var(--color-paper-3);
}

.depth-select:focus-visible {
  outline: 2px solid var(--color-focus);
  border-color: var(--color-rule-2);
}

#out.cpf-mode {
  white-space: normal;
  word-break: normal;
  padding: 0;
  overflow: hidden;
  display: flex;
}

.cpf-wrap {
  display: flex;
  flex: 1;
  min-height: 0;
  width: 100%;
}

.graph-canvas {
  position: relative;
  flex: 1;
  min-height: 320px;
  min-width: 0;
  background:
    radial-gradient(24rem 24rem at 30% 20%, color-mix(in oklab, var(--color-accent) 7%, transparent), transparent 60%),
    var(--color-paper);
}

.graph-canvas #cy {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.graph-organize {
  position: absolute;
  top: 10px;
  right: 12px;
  z-index: 6;
  background: var(--color-accent);
  color: var(--color-accent-ink);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
.graph-organize:hover { background: var(--color-accent-hover); }
.graph-organize:active { transform: translateY(1px); }

.ficha {
  width: 320px;
  flex-shrink: 0;
  border-left: 1px solid var(--color-rule);
  overflow-y: auto;
  background: var(--color-paper-2);
}

.ficha-head {
  padding: var(--space-md);
  border-bottom: 1px solid var(--color-rule);
}

.ficha-name {
  font-weight: 700;
  font-size: var(--text-md);
  color: var(--color-ink);
  letter-spacing: 0.02em;
  overflow-wrap: anywhere;
}

.ficha-sub {
  margin-top: var(--space-2xs);
  font-size: var(--text-xs);
  color: var(--color-accent-soft);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ficha-body {
  padding: var(--space-md);
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}

.ficha-row {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: var(--space-sm);
  font-size: var(--text-sm);
  line-height: 1.5;
}

.ficha-k {
  color: var(--color-neutral);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: var(--text-xs);
  padding-top: 1px;
  overflow-wrap: anywhere;
}

.ficha-v {
  color: var(--color-ink-2);
  overflow-wrap: anywhere;
  min-width: 0;
}

.ficha-sec {
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--color-rule);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--color-neutral);
}

.ficha-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  font-size: var(--text-sm);
  color: var(--color-ink-2);
  overflow-wrap: anywhere;
}

.ficha-empty {
  color: var(--color-muted);
  font-size: var(--text-sm);
}

.vinculo-li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2xs);
}
.vinculo-del {
  background: none;
  border: 1px solid var(--color-rule);
  color: var(--color-muted);
  border-radius: 4px;
  cursor: pointer;
  font-size: var(--text-xs);
  padding: 0 6px;
  line-height: 1.4;
}
.vinculo-del:hover {
  color: var(--color-accent-soft);
  border-color: var(--color-accent-soft);
}
.vinculo-add {
  display: flex;
  gap: var(--space-2xs);
  margin-top: var(--space-2xs);
}
.vinculo-input {
  flex: 1;
  min-width: 0;
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  color: var(--color-ink);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: var(--text-sm);
}
.vinculo-input:focus {
  outline: 2px solid var(--color-focus);
}
.vinculo-btn {
  background: var(--color-accent);
  color: var(--color-accent-ink);
  border: none;
  border-radius: 4px;
  padding: 5px 10px;
  font-size: var(--text-sm);
  cursor: pointer;
}
.vinculo-btn:hover {
  background: var(--color-accent-hover);
}

.ficha-obj {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  padding: var(--space-2xs) 0 var(--space-2xs) var(--space-sm);
  border-left: 2px solid var(--color-rule);
}

.ficha-objlist {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
}

.collapsed > .ficha-more { display: none; }

.ficha-toggle {
  margin-top: var(--space-2xs);
  padding: 2px 0;
  border: none;
  background: none;
  color: var(--color-accent);
  font-size: var(--text-xs);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  align-self: flex-start;
}

.cpf-legend {
  position: absolute;
  bottom: var(--space-sm);
  left: var(--space-sm);
  display: flex;
  gap: var(--space-md);
  font-size: var(--text-xs);
  color: var(--color-neutral);
  letter-spacing: 0.06em;
  pointer-events: none;
}

.cpf-legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 5px;
  border-radius: 50%;
  vertical-align: -1px;
}

.cpf-legend .lp { background: var(--color-accent); }
.cpf-legend .le { background: var(--color-rule-2); }
.cpf-legend .ln { background: #9b8cc2; }
.cpf-legend .la { background: #4fd1c5; }

.em-graph {
  display: flex;
  width: 100%;
  height: 460px;
  margin-bottom: var(--space-md);
  border: 1px solid var(--color-rule);
  border-radius: 8px;
  overflow: hidden;
}
.em-graph .graph-canvas { min-height: 0; }
.em-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
  font-size: var(--text-xs);
  color: var(--color-neutral);
  letter-spacing: 0.06em;
}
.em-legend i {
  display: inline-block;
  width: 10px; height: 10px; margin-right: 5px;
  border-radius: 50%; vertical-align: -1px;
}
.em-legend .eml-email   { background: #c08bff; }
.em-legend .eml-conta   { background: #7d3fd1; }
.em-legend .eml-breach  { background: #f87171; }
.em-legend .eml-stealer { background: #fb923c; }
.ficha-img {
  width: 72px; height: 72px; object-fit: cover;
  border-radius: 50%; border: 1px solid var(--color-rule); display: block;
}

@media (max-width: 720px) {
  .cpf-wrap { flex-direction: column; }
  .ficha { width: 100%; border-left: none; border-top: 1px solid var(--color-rule); max-height: 45%; }
  .graph-canvas { min-height: 260px; }
  .em-graph { flex-direction: column; height: 640px; }
  .em-graph .ficha { width: 100%; height: 45%; border-left: none; border-top: 1px solid var(--color-rule); }
}

/* ── OLLAMA — inventário de instâncias expostas ──────── */
.ol-stats {
  display: flex;
  gap: var(--space-xs);
  margin-bottom: var(--space-sm);
}
.ol-stat {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-md);
  background: var(--color-paper-2);
  padding: var(--space-xs) var(--space-sm);
  text-align: center;
}
.ol-stat-v {
  display: block;
  font-weight: 700;
  font-size: var(--text-md);
  color: var(--color-ink);
}
.ol-stat-k {
  display: block;
  font-size: var(--text-xs);
  color: var(--color-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.ol-host {
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-md);
  padding: var(--space-sm);
  margin-bottom: var(--space-sm);
  background: var(--color-paper-2);
}
.ol-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-sm);
  flex-wrap: wrap;
  margin-bottom: var(--space-xs);
}
.ol-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ol-addr {
  font-weight: 700;
  color: var(--color-accent-soft);
  letter-spacing: 0.02em;
}
.ol-geo { color: var(--color-muted); font-size: var(--text-sm); }
.ol-meta {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  flex-wrap: wrap;
  font-size: var(--text-xs);

}
.ol-count { color: var(--color-muted); }
.ol-seen { color: var(--color-neutral); }
.ol-loading {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 8rem;
}
.ol-q {
  display: inline-block;
  font-size: var(--text-xs);
  color: var(--color-muted);
  border: 1px solid var(--color-rule-2);
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 6px;
}
.ol-tbl {
  width: 100%;
  border-collapse: collapse;
  margin-top: var(--space-xs);
  font-size: var(--text-sm);
}
.ol-tbl th {
  text-align: left;
  color: var(--color-muted);
  font-weight: 500;
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
  padding: var(--space-2xs) var(--space-xs);
  border-bottom: 1px solid var(--color-rule);
}
.ol-tbl td {
  padding: var(--space-2xs) var(--space-xs);
  border-bottom: 1px solid var(--color-rule);
  color: var(--color-ink-2);
  vertical-align: top;
}
.ol-tbl tr:last-child td { border-bottom: none; }
.ol-name { color: var(--color-ink); word-break: break-all; }
.em-fav { width: 16px; height: 16px; border-radius: 3px; vertical-align: -3px; margin-right: 6px; object-fit: contain; display: inline-block; background: transparent; }
.ol-live {
  color: var(--color-ok);
  font-weight: 700;
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
}
.ol-dead { color: var(--color-neutral); }
.ob {
  display: inline-block;
  font-size: var(--text-xs);
  padding: 1px 6px;
  margin: 2px 4px 2px 0;
  border-radius: 3px;
  border: 1px solid var(--color-rule-2);
  color: var(--color-muted);
  background: var(--color-paper-3);
}
.ob-fake  { color: #f0a; border-color: oklch(68% 0.19 25 / 0.5); }
.ob-sus   { color: #fb3; border-color: oklch(75% 0.16 70 / 0.5); }
.ob-cloud { color: #6cf; border-color: oklch(72% 0.14 235 / 0.5); }
.ob-unc   { color: #9b8cc2; border-color: oklch(72% 0.14 295 / 0.5); }
.ob-leak  { color: #f66; border-color: oklch(68% 0.19 25 / 0.6); }

/* ── EMAIL OSINT ─────────────────────────────────────── */
.em-sec { margin-bottom: var(--space-md); }
.em-sec-h {
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-muted);
  margin: 0 0 var(--space-xs);
}
.em-block {
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: var(--radius-md);
  padding: var(--space-xs) var(--space-sm);
  margin-bottom: var(--space-xs);
}
.em-badge {
  display: inline-block;
  font-size: var(--text-xs);
  padding: 1px 6px;
  margin: 2px 4px 2px 0;
  border-radius: 3px;
  border: 1px solid var(--color-rule-2);
  color: var(--color-muted);
  background: var(--color-paper-3);
}
.em-found  { color: #4ade80; border-color: oklch(72% 0.18 145 / 0.5); }
.em-rate   { color: #fbbf24; border-color: oklch(75% 0.16 70 / 0.5); }
.em-breach { color: #f87171; border-color: oklch(68% 0.19 25 / 0.6); }
.em-acc    { color: #6cf;     border-color: oklch(72% 0.14 235 / 0.5); }
.em-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-sm);
  padding: var(--space-2xs) 0;
  border-bottom: 1px solid var(--color-rule);
  font-size: var(--text-sm);
}
.em-row:last-child { border-bottom: none; }
.em-k { color: var(--color-muted); }
.em-v { color: var(--color-ink-2); font-weight: 600; word-break: break-all; text-align: right; }
.em-pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: var(--text-sm);
  font-family: var(--font-mono);
  color: var(--color-ink-2);
  margin: 0;
}

/* ── perfil (contas identificadas) ── */
.pf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--space-sm);
}
.pf-card {
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pf-head {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  padding: var(--space-sm);
  border-bottom: 1px solid var(--color-rule);
  background: linear-gradient(180deg, oklch(21% 0.02 295 / 0.6), transparent);
}
.pf-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--color-rule-2);
  background: var(--color-paper-3);
  flex-shrink: 0;
}
.pf-id { min-width: 0; }
.pf-name { font-weight: 700; font-size: var(--text-md); color: var(--color-ink); overflow-wrap: anywhere; }
.pf-meta { font-size: var(--text-xs); color: var(--color-accent-soft); letter-spacing: 0.04em; overflow-wrap: anywhere; margin-top: 2px; }
.pf-body { padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-xs); }
.pf-bio { font-size: var(--text-sm); color: var(--color-ink-2); line-height: 1.55; white-space: pre-wrap; }
.pf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pf-chip {
  font-size: var(--text-xs); padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--color-rule-2); color: var(--color-ink-2); background: var(--color-paper-3);
}
.pf-rows { display: flex; flex-direction: column; }
.pf-row {
  display: flex; justify-content: space-between; gap: var(--space-sm);
  padding: var(--space-2xs) 0; border-bottom: 1px solid var(--color-rule);
  font-size: var(--text-sm);
}
.pf-row:last-child { border-bottom: none; }
.pf-k {
  color: var(--color-neutral); text-transform: uppercase; letter-spacing: 0.06em;
  font-size: var(--text-xs); padding-top: 1px; flex-shrink: 0;
}
.pf-v { color: var(--color-ink-2); word-break: break-word; text-align: right; min-width: 0; }
.pf-link { color: var(--color-accent-soft); text-decoration: none; border-bottom: 1px dotted var(--color-accent); }
.pf-link:hover { color: var(--color-accent); }
.pf-sub {
  margin-top: var(--space-2xs); font-size: var(--text-xs);
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-neutral);
}
.pf-time { display: flex; flex-direction: column; gap: var(--space-2xs); }
.pf-pos {
  padding: var(--space-xs) var(--space-sm); border-left: 2px solid var(--color-accent);
  background: var(--color-paper-3); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.pf-pos-title { font-weight: 600; color: var(--color-ink); font-size: var(--text-sm); }
.pf-pos-co { color: var(--color-muted); font-size: var(--text-sm); }
.pf-pos-date { color: var(--color-neutral); font-size: var(--text-xs); margin-top: 1px; }
.pf-rev {
  padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-rule);
  border-radius: var(--radius-md); background: var(--color-paper);
}
.pf-stars { color: #fbbf24; letter-spacing: 2px; }
.pf-rev-comment { color: var(--color-ink-2); font-size: var(--text-sm); margin-top: 2px; }
.pf-rev-loc { color: var(--color-neutral); font-size: var(--text-xs); margin-top: 2px; }
.pf-stats {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: var(--space-2xs);
}
.pf-stat {
  background: var(--color-paper-3); border: 1px solid var(--color-rule);
  border-radius: var(--radius-sm); padding: var(--space-2xs); text-align: center;
}
.pf-stat-v { display: block; font-weight: 700; color: var(--color-accent-soft); font-size: var(--text-md); }
.pf-stat-k { display: block; font-size: 10px; color: var(--color-neutral); text-transform: uppercase; letter-spacing: 0.05em; }
.pf-img { max-width: 100%; border-radius: var(--radius-md); }

.leaks-head {
  font-size: var(--text-sm);
  color: var(--color-ink);
  margin-bottom: var(--space-xs);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.leaks-head .ol-count { font-size: 1.25em; font-weight: 700; color: var(--color-accent); }
.leaks-pw {
  font-family: var(--font-mono);
  color: #4ade80;
  background: var(--color-paper-3);
  padding: 1px 5px;
  border-radius: 3px;
  word-break: break-all;
}
.leaks-hash {
  font-family: var(--font-mono);
  color: #fbbf24;
  word-break: break-all;
  font-size: var(--text-xs);
}
.leaks-file {
  color: var(--color-muted);
  font-size: var(--text-xs);
  word-break: break-all;
  max-width: 240px;
}

/* ── REDUCED MOTION ─────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .logo-dot { animation: none; }
  .status-dot { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-text">VAULTGREP</span><span class="logo-dot">.</span></div>
  <div class="header-right">
    <div class="mode-tabs">
      <button class="mode-tab active" id="tg" onclick="sw('grep')" aria-pressed="true">GREP -aEr</button>
      <button class="mode-tab" id="tc" onclick="sw('cat')" aria-pressed="false">CAT</button>
      <button class="mode-tab" id="tcpf" onclick="sw('cpf')" aria-pressed="false">CPF</button>
      <button class="mode-tab" id="tol" onclick="sw('ollama')" aria-pressed="false">OLLAMA</button>
      <button class="mode-tab" id="tem" onclick="sw('email')" aria-pressed="false">EMAIL</button>
    </div>
    <div class="status-pill" id="pill" title="todas as funções online">
      <div class="status-dot"></div>
      <span id="pill-label">ONLINE</span>
    </div>
  </div>
</header>

<main>
  <div class="section-label" id="mode-label">GREP -aEr</div>
  <div class="search-row">
    <div class="search-wrap">
      <input type="text" id="q" placeholder="google.com.br" aria-label="Termo de busca" autocomplete="off" spellcheck="false" autofocus>
    </div>
    <select id="depth" class="depth-select" aria-label="Profundidade do BFS" title="Níveis de parentes a partir do CPF">
      <option value="1">nível 1</option>
      <option value="2">nível 2</option>
      <option value="3" selected>nível 3</option>
    </select>
    <button id="btn" onclick="go()">
      <span id="btn-label">GREP</span>
      <span class="btn-arrow">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2.5 11.5L11.5 2.5M11.5 2.5H5.5M11.5 2.5V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
    <button id="orfr" onclick="refreshOllama()" title="Atualizar inventário" aria-label="Atualizar inventário">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="info-row">
    <span id="info"></span>
    <span class="status-tag" id="sts"></span>
  </div>

  <div class="results-card">
    <button id="cpb" onclick="cp()">COPY</button>
    <div id="out"><span class="ph">resultados vão aparecer aqui…</span></div>
  </div>

  <div id="pg">
    <button class="pg-btn" id="pgprev" onclick="goPage(-1)">← Anterior</button>
    <span id="pginfo"></span>
    <button class="pg-btn" id="pgnext" onclick="goPage(1)">Próxima →</button>
  </div>
</main>

<footer>
  <span class="footer-brand">VAULTGREP — INTERNAL TOOL</span>
  <span id="fc">X:0000 | Y:0000</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
const D = id => document.getElementById(id);
const PS = 5000;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode = 'grep', curPage = 1, totalPages = 1, lastQ = '', allLines = [], sMode = false;
let cy = null, CPF_GRAPH = null, EMAIL_DATA = null, EMAIL_ATUAL = '', EMAIL_VINCULOS = [];
const emptyBuf = () => ({
  out: '<span class="ph">resultados vão aparecer aqui…</span>',
  info: '',
  stsClass: 'status-tag',
  stsHtml: '',
  page: 1,
  totalPages: 1,
  lastQ: '',
  pgDisplay: 'none',
  pgInfo: '',
  pgprevDis: true,
  pgnextDis: true,
  qVal: '',
  allLines: [],
  sMode: false
});
const buf = { grep: emptyBuf(), cat: emptyBuf(), cpf: emptyBuf(), ollama: emptyBuf(), email: emptyBuf() };

document.addEventListener('mousemove', e => {
  const x = String(e.clientX).padStart(4, '0');
  const y = String(e.clientY).padStart(4, '0');
  D('fc').textContent = 'X:' + x + ' | Y:' + y;
});

const loadingHtml = '<div class="bars"><span></span><span></span><span></span><span></span><span></span></div>';

function setStatus(type, html) {
  D('sts').className = 'status-tag ' + type;
  D('sts').innerHTML = html;
}

function sw(m) {
  buf[mode] = {
    out: D('out').innerHTML,
    info: D('info').textContent,
    stsClass: D('sts').className,
    stsHtml: D('sts').innerHTML,
    page: curPage,
    totalPages: totalPages,
    lastQ: lastQ,
    pgDisplay: D('pg').style.display,
    pgInfo: D('pginfo').textContent,
    pgprevDis: D('pgprev').disabled,
    pgnextDis: D('pgnext').disabled,
    qVal: D('q').value,
    allLines: [...allLines],
    sMode: sMode
  };
  mode = m;
  refreshFeatures();
  const s = buf[m];
  D('out').innerHTML = s.out;
  D('info').textContent = s.info;
  D('sts').className = s.stsClass;
  D('sts').innerHTML = s.stsHtml;
  curPage = s.page;
  totalPages = s.totalPages;
  lastQ = s.lastQ;
  D('pg').style.display = s.pgDisplay;
  D('pginfo').textContent = s.pgInfo;
  D('pgprev').disabled = s.pgprevDis;
  D('pgnext').disabled = s.pgnextDis;
  D('q').value = s.qVal;
  allLines = s.allLines;
  sMode = s.sMode;

  D('tg').className = 'mode-tab';
  D('tc').className = 'mode-tab';
  D('tcpf').className = 'mode-tab';
  D('tol').className = 'mode-tab';
  D('tem').className = 'mode-tab';
  D('tg').setAttribute('aria-pressed', 'false');
  D('tc').setAttribute('aria-pressed', 'false');
  D('tcpf').setAttribute('aria-pressed', 'false');
  D('tol').setAttribute('aria-pressed', 'false');
  D('tem').setAttribute('aria-pressed', 'false');

  D('out').classList.remove('cpf-mode');
  D('depth').style.display = 'none';
  D('cpb').style.display = 'none';
  D('orfr').style.display = 'none';
  if (cy) { cy.destroy(); cy = null; }

  if (m === 'grep') {
    D('tg').className = 'mode-tab active';
    D('tg').setAttribute('aria-pressed', 'true');
    D('q').placeholder = 'google.com.br';
    D('btn-label').textContent = 'GREP';
    D('mode-label').textContent = 'GREP -aEr';
  } else if (m === 'cat') {
    D('tc').className = 'mode-tab active';
    D('tc').setAttribute('aria-pressed', 'true');
    D('q').placeholder = 'escape60.com.br';
    D('btn-label').textContent = 'CAT';
    D('mode-label').textContent = 'CAT';
  } else if (m === 'cpf') {
    D('tcpf').className = 'mode-tab active';
    D('tcpf').setAttribute('aria-pressed', 'true');
    D('q').placeholder = 'CPF (só números)';
    D('btn-label').textContent = 'CPF';
    D('mode-label').textContent = 'CPF — REDE DE VÍNCULOS';
    D('depth').style.display = 'block';
    D('out').classList.add('cpf-mode');

function showP(n) {
  curPage = n;
  const s = (n - 1) * PS;
  D('out').textContent = allLines.slice(s, s + PS).join('\n');
  D('pginfo').textContent = 'Pág ' + n + ' / ' + totalPages;
  D('pgprev').disabled = n <= 1;
  D('pgnext').disabled = n >= totalPages;
}

function goPage(d) {
  if (d === -1 && curPage <= 1 || d === 1 && curPage >= totalPages) return;
  if (sMode) showP(curPage + d);
  else go(curPage + d);
}

function cp() {
  const t = D('out').textContent;
  if (!t) return;
  function ok() {
    const b = D('cpb');
    b.textContent = 'COPIED!';
    b.classList.add('copied');
    setTimeout(() => { b.textContent = 'COPY'; b.classList.remove('copied'); }, 1500);
  }
  function fb() {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); } catch(e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(ok).catch(fb);
  } else {
    fb();
  }
}

async function go(pg) {
  if (mode === 'cpf') return goCpf();
  if (mode === 'ollama') return goOllama(pg);
  if (mode === 'email') return goEmail();
  const q = D('q').value.trim();
  if (!q) return;
  if (q !== lastQ) pg = 1;
  lastQ = q;
  curPage = pg || 1;
  const b = D('btn');
  const lb = mode === 'grep' ? 'GREP' : 'CAT';
  b.disabled = true;
  D('btn-label').textContent = '...';
  setStatus('loading', loadingHtml + ' executando');
  D('out').innerHTML = '';
  D('info').textContent = '';
  D('cpb').style.display = 'none';
  D('pg').style.display = 'none';
  const t0 = performance.now();
  const el = () => ((performance.now() - t0) / 1000).toFixed(2);
  try {
    if (mode === 'cat') {
      const r = await fetch('/cat?file=' + encodeURIComponent(q));
      const txt = await r.text();
      if (r.ok) setStatus('ok', r.status + ' OK');
      else setStatus('err', r.status + '');
      D('info').textContent = el() + 's · cat ' + q;
      D('out').textContent = txt || (r.ok ? '(arquivo vazio)' : 'Erro ' + r.status);
      D('cpb').style.display = 'block';
      return;
    }
    const r = await fetch('/search?q=' + encodeURIComponent(q) + '&page=' + curPage);
    if (!r.ok) {
      setStatus('err', 'HTTP ' + r.status);
      D('out').textContent = await r.text() || 'Erro ' + r.status;
      D('cpb').style.display = 'block';
      return;
    }
    if (r.headers.get('X-Stream') === '1') {
      sMode = true;
      allLines = [];
      setStatus('loading', loadingHtml + ' recebendo');
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let rbuf = '', eofTotal = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (value) rbuf += dec.decode(value, { stream: !done });
        let nl;
        while ((nl = rbuf.indexOf('\n')) !== -1) {
          const line = rbuf.slice(0, nl);
          rbuf = rbuf.slice(nl + 1);
          if (line.startsWith('__EOF__')) {
            eofTotal = parseInt(line.slice(7)) || allLines.length;
          } else if (line) {
            allLines.push(line);
          }
        }
        if (allLines.length > 0) {
          D('out').textContent = allLines.slice(0, PS).join('\n');
          D('info').innerHTML = allLines.length + ' linhas · ' + el() + 's · <span class="streaming-word">streaming…</span>';
        }
        if (done) break;
      }
      totalPages = Math.ceil(allLines.length / PS) || 1;
      if (allLines.length === 0) {
        D('out').textContent = '(nenhum resultado)';
      } else {
        showP(1);
      }
      setStatus('ok', '200 OK');
      D('info').textContent = (eofTotal || allLines.length) + ' linhas · ' + el() + 's · grep -aEr \'' + q + '\' .';
      D('cpb').style.display = 'block';
      if (totalPages > 1) {
        D('pg').style.display = 'flex';
        D('pgprev').disabled = true;
        D('pgnext').disabled = false;
      }
    } else {
      sMode = false;
      const tp = parseInt(r.headers.get('X-Total-Pages') || '1');
      const tl = parseInt(r.headers.get('X-Total-Lines') || '0');
      totalPages = tp;
      const txt = await r.text();
      const ln = txt.split('\n').filter(l => l.trim()).length;
      setStatus('ok', r.status + ' OK');
      const li = tl > 0 ? tl + ' linhas' : ln + ' linhas';
      const pi = tp > 1 ? ' · pág ' + curPage + '/' + tp : '';
      D('info').textContent = li + pi + ' · ' + el() + 's · grep -aEr \'' + q + '\' .';
      D('out').textContent = txt || '(nenhum resultado)';
      D('cpb').style.display = 'block';
      if (tp > 1) {
        D('pg').style.display = 'flex';
        D('pginfo').textContent = 'Pág ' + curPage + ' / ' + tp;
        D('pgprev').disabled = curPage <= 1;
        D('pgnext').disabled = curPage >= tp;
      }
    }
  } catch(e) {
    setStatus('err', 'ERRO');
    D('out').textContent = 'Falha:\n' + e.message;
  } finally {
    b.disabled = false;
    D('btn-label').textContent = lb;
  }
}

function escFlags(flags) {
  return (flags || []).map(f => {
    const s = String(f);
    let cls = 'ob';
    if (/^FAKE/.test(s)) cls = 'ob-fake';
    else if (/^SUS/.test(s)) cls = 'ob-sus';
    else if (/^CLOUD/.test(s)) cls = 'ob-cloud';
    else if (/UNCENSORED|ABLIT/.test(s)) cls = 'ob-unc';
    else if (/^PATH/.test(s)) cls = 'ob-leak';
    return '<span class="ob ' + cls + '">' + esc(s) + '</span>';
  }).join('');
}

function fmtAgo(iso) {
  if (!iso) return '—';
  const t = Date.parse(iso);
  if (isNaN(t)) return iso;
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return 'há ' + s + 's';
  if (s < 3600) return 'há ' + Math.floor(s / 60) + 'min';
  if (s < 86400) return 'há ' + Math.floor(s / 3600) + 'h';
  return 'há ' + Math.floor(s / 86400) + 'd';
}

  }

  if (hh && hh.ok !== false) {
    const found = hh.found || [];
    const rate = hh.rate_limited || [];
    const errs = hh.errors || [];
    html += '<div class="ol-stats">'
      + '<div class="ol-stat"><span class="ol-stat-v ol-live">' + found.length + '</span><span class="ol-stat-k">contas achadas</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + (hh.total || 0) + '</span><span class="ol-stat-k">sites checados</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + rate.length + '</span><span class="ol-stat-k">rate limit</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + errs.length + '</span><span class="ol-stat-k">erros</span></div>'
      + '</div>';

    html += '<div class="em-sec"><div class="em-sec-h">holehe — contas encontradas</div>';
    if (!found.length) {
      html += '<div class="em-block"><span class="ph">nenhuma conta encontrada nos ' + (hh.total || 0) + ' sites</span></div>';
    } else {
      html += '<table class="ol-tbl"><thead><tr><th>SITE</th><th>DOMÍNIO</th><th>RECUPERAÇÃO</th><th>TELEFONE</th></tr></thead><tbody>';
      found.forEach(f => {
        const rec = (f.emailrecovery != null && f.emailrecovery !== '') ? f.emailrecovery : '—';
        const ph = (f.phoneNumber != null && f.phoneNumber !== '') ? f.phoneNumber : '—';
        html += '<tr><td class="ol-name">' + faviconImg(f.domain) + esc(f.name) + '</td><td>' + esc(f.domain) + '</td><td>' + esc(rec) + '</td><td>' + esc(ph) + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    if (rate.length) html += '<div class="em-sec"><div class="em-sec-h">rate limited · ' + rate.length + ' sites</div><div class="em-block"><span class="em-v">' + esc(rate.join(', ')) + '</span></div></div>';
    if (errs.length) html += '<div class="em-sec"><div class="em-sec-h">erros</div><div class="em-block">' + emBadges(errs, 'em-breach', 'nenhum') + '</div></div>';
  } else if (hh) {
    html += '<div class="em-block"><span class="ph">holehe: ' + esc(hh.error || 'falha') + '</span></div>';
  }

  const us = data.userscanner;
  if (us && us.ok !== false) {
    const uf = us.found || [];
    const uerrs = us.errors || [];
    const uskips = us.skipped || [];
    html += '<div class="ol-stats">'
      + '<div class="ol-stat"><span class="ol-stat-v ol-live">' + uf.length + '</span><span class="ol-stat-k">contas (user-scanner)</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + (us.total || 0) + '</span><span class="ol-stat-k">sites checados</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + uerrs.length + '</span><span class="ol-stat-k">erros</span></div>'
      + '<div class="ol-stat"><span class="ol-stat-v">' + uskips.length + '</span><span class="ol-stat-k">pulados (loud)</span></div>'
      + '</div>';

    html += '<div class="em-sec"><div class="em-sec-h">user-scanner — contas encontradas</div>';
    if (!uf.length) {
      html += '<div class="em-block"><span class="ph">nenhuma conta nos ' + (us.total || 0) + ' sites</span></div>';
    } else {
      html += '<table class="ol-tbl"><thead><tr><th>SITE</th><th>CATEGORIA</th><th>URL</th><th>DETALHES</th></tr></thead><tbody>';
      uf.forEach(f => {
        const det = (f.extra && Object.keys(f.extra).length)
          ? Object.entries(f.extra).map(([k, v]) => esc(k) + ': ' + esc(v)).join(' · ') : '—';
        html += '<tr><td class="ol-name">' + faviconImg(hostOf(f.url) || f.domain || '') + esc(f.site_name) + '</td><td>' + esc(f.category || '—') + '</td><td>' + esc(f.url || '—') + '</td><td>' + det + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    if (uerrs.length) html += '<div class="em-sec"><div class="em-sec-h">erros · ' + uerrs.length + ' sites</div><div class="em-block">' + emBadges(uerrs.map(x => x.site_name || x.username || '?'), 'em-breach', 'nenhum') + '</div></div>';
    if (uskips.length) html += '<div class="em-sec"><div class="em-sec-h">pulados (avisariam o alvo) · ' + uskips.length + '</div><div class="em-block">' + emBadges(uskips.map(x => x.site_name || '?'), 'em-breach', 'nenhum') + '</div></div>';
  } else if (us) {
    html += '<div class="em-block"><span class="ph">user-scanner: ' + esc(us.error || 'falha') + '</span></div>';
  }

  if (eo && eo.ok !== false) {
    const v = eo.validator || {};
    const reg = v.registered || [];
    const unreg = v.unregistered || [];
    const meta = eo.meta || {};
    html += '<div class="em-sec"><div class="em-sec-h">emailosint</div>';
    html += '<div class="em-block">'
      + '<span class="em-badge em-found">' + reg.length + ' registrados</span>'
      + '<span class="em-badge">' + unreg.length + ' não registrados</span>'
      + (meta.cloaked ? '<span class="em-badge em-breach">cloaked</span>' : '')
      + (meta.redacted ? '<span class="em-badge em-breach">redacted</span>' : '')
      + '</div>';
    const regNames = reg.map(x => (x && x.name_formatted) || (typeof x === 'string' ? x : (x && (x.name || x.domain)) || '?'));
    if (regNames.length) html += '<div class="em-block">' + emBadges(regNames, 'em-found', 'nenhum') + '</div>';
    html += '</div>';

    const tl = meta.timeline || [];
    if (tl.length) {
      html += '<div class="em-sec"><div class="em-sec-h">linha do tempo</div><div class="em-block">';
      tl.forEach(t => {
        const src = t.source === 'data_breach' ? 'breach' : (t.source || 'evento');
        html += '<div class="em-row"><span class="em-k">' + esc(t.name || '?') + '</span><span class="em-v">' + esc(String(t.date || '').slice(0, 10)) + ' · ' + esc(src) + '</span></div>';
      });
      html += '</div></div>';
    }

    const db = eo.data_breaches;
    if (db != null) {
      const ok = db && db.compromised === true;
      html += '<div class="em-sec"><div class="em-sec-h">data breaches</div><div class="em-block"><span class="em-badge ' + (ok ? 'em-breach' : 'em-found') + '">' + (ok ? 'comprometido' : 'não comprometido') + '</span></div></div>';
    }
    const sl = eo.stealer_logs;
    if (sl != null) {
      const ok = sl && sl.compromised === true;
      html += '<div class="em-sec"><div class="em-sec-h">stealer logs</div><div class="em-block"><span class="em-badge ' + (ok ? 'em-breach' : 'em-found') + '">' + (ok ? 'comprometido' : 'não comprometido') + '</span></div></div>';
    }

    const ident = eo.identifier || [];
    if (ident.length) {
      html += '<div class="em-sec"><div class="em-sec-h">contas / perfis (' + ident.length + ')</div>';
      html += '<div class="pf-grid">' + ident.map(i => renderEmailProfile(i)).join('') + '</div>';
      html += '</div>';
    }

    if (eo.ai != null) {
      const ai = eo.ai;
      html += '<div class="em-sec"><div class="em-sec-h">resumo IA</div><div class="em-block">';
      if (ai && ai.risk) html += '<div class="em-row"><span class="em-k">risco</span><span class="em-v">' + esc(ai.risk) + '</span></div>';
      if (ai && ai.headline) html += '<div class="em-row"><span class="em-k">' + esc(ai.headline) + '</span></div>';
      const bullets = (ai && ai.bullets) || [];
      bullets.forEach(b => { html += '<div class="em-row"><span class="em-v">· ' + esc(b) + '</span></div>'; });
      if (!(ai && ai.headline) && !bullets.length) html += '<pre class="em-pre">' + esc(typeof ai === 'string' ? ai : JSON.stringify(ai, null, 2)) + '</pre>';
      html += '</div></div>';
    }
  } else if (eo) {
    html += '<div class="em-block"><span class="ph">emailosint: ' + esc(eo.error || 'falha') + (eo.code ? ' (' + esc(eo.code) + ')' : '') + '</span></div>';
  }

  D('out').innerHTML = html;
  if (g && (g.nodes || []).length > 1) drawEmailGraph(g);
}

function organizeGraph() {
  if (typeof cytoscape === 'undefined' || !cy) return;
  cy.layout({
    name: 'cose',
    animate: true,
    animationDuration: 400,
    nodeRepulsion: () => 4500,
    idealEdgeLength: () => 60,
    padding: 30,
    randomize: true
  }).run();
}

function drawEmailGraph(g) {
  if (typeof cytoscape === 'undefined') {
    D('cy').innerHTML = '<span class="ph" style="padding:1rem;display:block">cytoscape não carregou (CDN)</span>';
    return;
  }
  const els = [];
  (g.nodes || []).forEach(n => {
    const d = {
      id: n.id, label: n.label, type: n.type,
      domain: n.domain || '', icon: n.icon || '', avatar: n.avatar || '',
      full_name: n.full_name || '', username: n.username || '', bio: n.bio || '',
      profile_url: n.profile_url || '', location: n.location || '', phone: n.phone || '',
      date: n.date || '', email: n.email || '', fields: n.fields || [] };
    // caixa do seed (email) cresce pra caber o texto + folga — nunca corta o alvo
    if (n.type === 'email') {
      const label = n.label || n.email || '';
      d.width = Math.max(150, Math.round(label.length * 7.5) + 28);
      d.height = 42;
    }
    els.push({ data: d });
  });
  (g.edges || []).forEach(e => els.push({ data: {
    id: e.id, source: e.source, target: e.target, label: e.label } }));

  if (cy) cy.destroy();
  cy = cytoscape({
    container: D('cy'),
    elements: els,
    minZoom: 0.2,
    maxZoom: 3,
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'font-size': 9, 'color': '#c9c9d8',
        'text-valign': 'bottom', 'text-margin-y': 5,
        'text-wrap': 'wrap', 'text-max-width': 90,
        'border-width': 1, 'border-color': 'rgba(0,0,0,0.4)' } },
      { selector: 'node[type = "email"]', style: {
        'background-color': '#c08bff', 'shape': 'round-rectangle',
        'width': 'data(width)', 'height': 'data(height)', 'font-size': 11, 'font-weight': 'bold',
        'text-valign': 'center', 'text-margin-y': 0, 'text-wrap': 'none',
        'color': '#1a1a22', 'border-width': 3, 'border-color': '#e0c4ff' } },
      { selector: 'node[type = "conta"]', style: {
        'background-color': '#4a4a5e', 'shape': 'round-rectangle',
        'width': 34, 'height': 34 } },
      { selector: 'node[type = "conta"][?avatar]', style: {
        'background-image': 'data(avatar)', 'background-fit': 'cover',
        'background-clip': 'node', 'border-width': 2, 'border-color': '#7d3fd1' } },
      { selector: 'node[type = "conta"][!avatar][?icon]', style: {
        'background-image': 'data(icon)', 'background-fit': 'cover',
        'background-clip': 'node', 'background-opacity': 0.85 } },
      { selector: 'node[type = "breach"]', style: {
        'background-color': '#f87171', 'shape': 'ellipse', 'width': 20, 'height': 20 } },
      { selector: 'node[type = "stealer"]', style: {
        'background-color': '#fb923c', 'shape': 'diamond', 'width': 22, 'height': 22 } },
      { selector: 'edge', style: {
        'width': 1.2, 'line-color': '#3c3c4e', 'curve-style': 'bezier',
        'target-arrow-shape': 'triangle', 'target-arrow-color': '#3c3c4e',
        'label': 'data(label)', 'font-size': 9, 'color': '#d8d8e4',
        'text-rotation': 'autorotate', 'text-background-color': '#1a1a22',
        'text-background-opacity': 0.92, 'text-background-padding': 3 } },
      { selector: ':selected', style: { 'border-width': 2, 'border-color': '#f0c8ff' } }
    ],
    layout: {
      name: 'concentric',
      concentric: node => (node.data('type') === 'email' ? 1 : 2),
      levelWidth: () => 1,
      minNodeSpacing: 55,
      padding: 34
    }
  });
  cy.on('tap', 'node', evt => {
    const rec = nodeById(g, evt.target.id());
    if (rec) showEmailFicha(rec);
  });
  const seed = nodeById(g, 'email');
  if (seed) showEmailFicha(seed);
}

function showEmailFicha(n) {
  const v = x => (x == null || x === '') ? '—' : x;
  const img = (url, alt) => url
    ? '<img class="ficha-img" src="' + esc(url) + '" alt="' + esc(alt || '') + '" referrerpolicy="no-referrer">'
    : '';
  const head = (name, sub) => '<div class="ficha-head"><div class="ficha-name">' + esc(name) + '</div><div class="ficha-sub">' + sub + '</div></div>';
  const row = (k, val) => '<div class="ficha-row"><span class="ficha-k">' + k + '</span><span class="ficha-v">' + val + '</span></div>';
  if (n.type === 'email') {
    D('ficha').innerHTML = head(n.email || n.label, 'seed · investigação')
      + '<div class="ficha-body">' + row('TIPO', 'e-mail') + row('ALVO', v(n.email || n.label)) + '</div>';
    return;
  }
  if (n.type === 'conta') {
    let rows = '';
    if (n.avatar) rows += row('FOTO', img(n.avatar, n.full_name || n.label));
    if (n.full_name) rows += row('NOME', v(n.full_name));
    if (n.username) rows += row('USERNAME', v(n.username));
    if (n.domain) rows += row('DOMÍNIO', v(n.domain));
    if (n.profile_url) rows += row('PERFIL', '<a href="' + esc(n.profile_url) + '" target="_blank" rel="noopener">abrir</a>');
    if (n.location) rows += row('LOCALIZAÇÃO', esc(v(n.location)));
    if (n.phone) rows += row('TELEFONE', esc(v(n.phone)));
    if (n.bio) rows += row('BIO', v(n.bio));
    const fields = n.fields || [];
    if (fields.length) {
      const seen = new Set(['avatar_url','profile_image','avatar','full_name','first_name','last_name','username','twitter_username','unique_name','display_name','nickname','bio','profile_url','links','location','locations','phone_number','phone']);
      const fval = (f) => {
        const vv = f.v;
        if (f.type === 'bool') return vv ? 'sim' : 'não';
        if (f.type === 'url') return '<a style="color:var(--color-accent-soft)" href="' + esc(vv) + '" target="_blank" rel="noopener">abrir</a>';
        if (f.type === 'image') return '<a style="color:var(--color-accent-soft)" href="' + esc(vv) + '" target="_blank" rel="noopener">ver</a>';
        if (Array.isArray(vv)) return esc(vv.map(x => (x && typeof x === 'object') ? JSON.stringify(x) : x).join(' · '));
        if (vv && typeof vv === 'object') return esc(JSON.stringify(vv));
        return esc(String(vv ?? ''));
      };
      let dump = '';
      fields.forEach(f => {
        if (seen.has(f.k)) return;
        if (f.v == null || f.v === '' || f.v === false) return;
        dump += row(f.label || f.k, fval(f));
      });
      if (dump) rows += '<div class="ficha-sec">dados</div>' + dump;
    }
    D('ficha').innerHTML = head(n.label, 'conta') + '<div class="ficha-body">' + rows + '</div>';
    return;
  }
  if (n.type === 'breach') {
    D('ficha').innerHTML = head(n.label, 'data breach') + '<div class="ficha-body">' + row('DATA', v(n.date)) + '</div>';
    return;
  }
  if (n.type === 'stealer') {
    D('ficha').innerHTML = head('stealer log', 'infostealer') + '<div class="ficha-body">' + row('STATUS', 'comprometido') + '</div>';
    return;
  }
}

function renderEmailLeaks(leaks, email) {
  const box = D('em-leaks');
  if (!box) return;
  if (!leaks || leaks.error) {
    box.innerHTML = '<span class="ph">' + esc((leaks && leaks.error) || 'falha ao buscar senhas') + '</span>';
    return;
  }
  const total = leaks.total || 0;
  const rs = leaks.results || [];
  if (!total) {
    box.innerHTML = '<span class="ph">nenhuma senha no vault para ' + esc(email) + '</span>';
    return;
  }
  let h = '<div class="leaks-head"><span class="ol-count">' + total + '</span> senha(s) vazada(s)'
    + (leaks.truncated ? ' · mostrando ' + rs.length : '') + '</div>';
  h += '<table class="ol-tbl"><thead><tr><th>ORIGEM</th><th>USUÁRIO</th><th>SENHA</th><th>ARQUIVO</th></tr></thead><tbody>';
  rs.forEach(r => {
    const pw = r.hash
      ? '<span class="leaks-hash" title="hash — não é senha em claro">' + esc(r.password) + '</span>'
      : '<code class="leaks-pw">' + esc(r.password) + '</code>';
    h += '<tr><td class="ol-name">' + esc(r.url || '—') + '</td>'
      + '<td>' + esc(r.user || email) + '</td>'
      + '<td>' + pw + '</td>'
      + '<td class="leaks-file">' + esc(r.file || '') + '</td></tr>';
  });
  h += '</tbody></table>';
  box.innerHTML = h;
}

async function goEmail() {
  const q = D('q').value.trim().toLowerCase();
  if (!emailValido(q)) {
    setStatus('err', 'E-MAIL INVÁLIDO');
    D('out').innerHTML = '<span class="ph">digite um e-mail válido (ex.: usuario@dominio.com)</span>';
    return;
  }
  const b = D('btn');
  b.disabled = true;
  D('btn-label').textContent = '...';
  setStatus('loading', loadingHtml + ' osint em andamento');
  D('out').innerHTML = '<div class="ol-loading">' + loadingHtml + '</div>';
  D('info').textContent = '';
  D('cpb').style.display = 'none';
  D('pg').style.display = 'none';
  const t0 = performance.now();
  try {
    // senhas do vault em paralelo com o OSINT — não bloqueia o grafo
    const leakP = fetch('/email/leaks?q=' + encodeURIComponent(q))
      .then(r => r.json())
      .catch(e => ({ error: String(e.message || e) }));
    const r = await fetch('/email?q=' + encodeURIComponent(q) + '&provider=all');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    renderEmail(data, q);
    leakP.then(leaks => renderEmailLeaks(leaks, q));
    const el = ((performance.now() - t0) / 1000).toFixed(2);
    const found = ((data.holehe && data.holehe.found) ? data.holehe.found.length : 0)
      + ((data.userscanner && data.userscanner.found) ? data.userscanner.found.length : 0)
      + ((data.emailosint && data.emailosint.validator && data.emailosint.validator.registered)
        ? data.emailosint.validator.registered.length : 0);
    setStatus('ok', '200 OK');
    let info = found + ' contas · ' + el + 's';
    if (data.cached && data.updated_at) {
      const d = new Date(data.updated_at * 1000);
      info = 'cache · ' + found + ' contas · atualizado ' + d.toLocaleDateString('pt-BR') + ' · ' + el + 's';
    }
    D('info').textContent = info;
  } catch (e) {
    setStatus('err', 'ERRO');
    D('out').innerHTML = '<span class="ph">' + esc(e.message) + '</span>';
  } finally {
    b.disabled = false;
    D('btn-label').textContent = 'OSINT';
  }
}

// ── CPF — rede de vínculos ────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function escAttr(s) {
  return JSON.stringify(String(s ?? '')).replace(/</g, '\\u003c');
}

// ── Vínculos manuais e-mail↔CPF ──────────────────────

async function vinculoPost(body, remove) {
  const r = await fetch(remove ? '/vinculos/remove' : '/vinculos', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function addVinculoEmail(email) {
  const input = D('vinculo-cpf');
  const cpf = (input ? input.value : '').replace(/\D/g, '');
  if (cpf.length !== 11 || !cpfValido(cpf)) {
    setStatus('err', 'CPF INVÁLIDO');
    return;
  }
  try {
    await vinculoPost({ email: email, cpf: cpf });
    await refreshVinculosEmail(email);
    setStatus('ok', 'VÍNCULO ADICIONADO');
  } catch (e) {
    setStatus('err', 'ERRO: ' + e.message);
  }
}

async function removeVinculoEmail(email, cpf) {
  try {
    await vinculoPost({ email: email, cpf: cpf }, true);
    await refreshVinculosEmail(email);
    setStatus('ok', 'VÍNCULO REMOVIDO');
  } catch (e) {
    setStatus('err', 'ERRO: ' + e.message);
  }
}

async function refreshVinculosEmail(email) {

async function removeVinculoCpf(cpf, email) {
