}

async function refreshVinculosCpf(cpf) {
  const r = await fetch('/vinculos?cpf=' + encodeURIComponent(cpf));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  if (CPF_GRAPH) CPF_GRAPH.vinculos = j.vinculos || [];
  const seed = CPF_GRAPH && nodeById(CPF_GRAPH, 'cpf:' + cpf);
  if (seed) showFicha(seed);
}

function fmtCpf(cpf) {
  const s = String(cpf || '');
  return s.length === 11 ? s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : s;
}

function cpfValido(s) {
  if (s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
  const dv = (base, pesos) => {
    const t = base.split('').reduce((a, d, i) => a + (+d) * pesos[i], 0) % 11;
    return t < 2 ? '0' : String(11 - t);
  };
  return dv(s.slice(0, 9), [10, 9, 8, 7, 6, 5, 4, 3, 2]) === s[9]
      && dv(s.slice(0, 10), [11, 10, 9, 8, 7, 6, 5, 4, 3, 2]) === s[10];
}

function fmtTel(t) {
  const d = String(t && t.TELEFONE !== undefined ? t.TELEFONE : t || '');
  return d;
}

function nodeById(g, id) { return (g.nodes || []).find(n => n.id === id); }

async function goCpf() {
  const q = D('q').value.trim().replace(/\D/g, '');
  if (q.length !== 11) {
    setStatus('err', 'CPF INVÁLIDO');
    D('out').innerHTML = '<span class="ph">digite um CPF com 11 dígitos</span>';
    return;
  }
  if (!cpfValido(q)) {
    setStatus('err', 'CPF INVÁLIDO');
    D('out').innerHTML = '<span class="ph">CPF inválido, inexistente ou proibido</span>';
    return;
  }
  const depth = D('depth').value || '3';
  const b = D('btn');
  b.disabled = true;
  D('btn-label').textContent = '...';
  setStatus('loading', loadingHtml + ' enriquecendo');
  D('out').innerHTML = '<span class="ph">consultando ' + fmtCpf(q) + ' … BFS até nível ' + depth + '</span>';
  D('info').textContent = '';
  const t0 = performance.now();
  try {
    let g = await cpfFetch(q, depth);
    if (g && g.requireCaptcha) {
      setStatus('loading', loadingHtml + ' verificação de segurança');
      const token = await pedirCaptcha(g.siteKey);
      g = await cpfResolver(q, token, depth);
    }
    if (g && g.requireCaptcha) throw new Error(g.error || 'captcha necessário');
    CPF_GRAPH = g;
    renderCpf(g);
    const el = ((performance.now() - t0) / 1000).toFixed(2);
    setStatus('ok', '200 OK');
    D('info').textContent = g.nodes.length + ' nós · ' + g.edges.length + ' vínculos · '
      + (g.consultas || 0) + ' consultas · ' + el + 's';
  } catch (e) {
    const cpfErr = /CPF inv[áa]lido|inexistente|proibido/i.test(e.message || '');
    setStatus('err', cpfErr ? 'CPF INVÁLIDO' : 'ERRO');
    D('out').innerHTML = '<span class="ph">' + esc(e.message) + '</span>';
  } finally {
    b.disabled = false;
    D('btn-label').textContent = 'CPF';
  }
}

async function cpfFetch(q, depth) {
  const r = await fetch('/cpf?q=' + q + '&depth=' + depth);
  const g = await r.json();
  if (!r.ok && !(g && g.requireCaptcha)) throw new Error(g.error || ('HTTP ' + r.status));
  return g;
}

async function cpfResolver(q, token, depth) {
  const r = await fetch('/cpf/resolver', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cpf: q, token: token, depth: depth})
  });
  const g = await r.json();
  if (!r.ok && !(g && g.requireCaptcha)) throw new Error(g.error || ('HTTP ' + r.status));
  return g;
}

function pedirCaptcha(siteKey) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('captcha não respondeu (domínio não autorizado?)')), 60000);
    const finish = fn => (...args) => { clearTimeout(timer); fn(...args); };
    D('out').innerHTML =
      '<div class="ph">a consulta exige verificação de segurança</div>' +
      '<div id="ts-box" style="display:flex;justify-content:center;margin-top:1rem"></div>';
    const render = () => {
      if (!window.turnstile) return finish(reject)(new Error('Turnstile não carregou'));
      window.turnstile.render(D('ts-box'), {
        sitekey: siteKey,
        callback: finish(resolve),
        'error-callback': finish(() => reject(new Error('erro no captcha (domínio não autorizado?)'))),
        'expired-callback': finish(() => reject(new Error('captcha expirado, tente de novo'))),
      });
    };
    if (window.turnstile) return render();
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true;
    s.onload = render;
    s.onerror = finish(() => reject(new Error('falha ao carregar Turnstile')));
    document.head.appendChild(s);
  });
}

function renderCpf(g) {
  const seed = nodeById(g, 'cpf:' + g.seed) || (g.nodes || []).find(n => n.type === 'pessoa');
  D('out').innerHTML =
    '<div class="cpf-wrap">' +
      '<div class="graph-canvas"><div id="cy"></div><button class="graph-organize" onclick="organizeGraph()">organizar</button></div>' +
      '<aside class="ficha" id="ficha"></aside>' +
    '</div>' +
    '<div class="cpf-legend"><span><i class="lp"></i>pessoa</span><span><i class="le"></i>empresa</span><span><i class="ln"></i>parente (só nome)</span><span><i class="la"></i>dado</span></div>';
  drawGraph(g);
  if (seed) showFicha(seed);
}

function drawGraph(g) {
  if (typeof cytoscape === 'undefined') {
    D('cy').innerHTML = '<span class="ph" style="padding:1rem;display:block">cytoscape não carregou (CDN)</span>';
    return;
  }
  const isSeed = id => id === 'cpf:' + g.seed;
  const fmtCnpj = c => { const s = String(c || ''); return s.length === 14 ? s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : s; };
  // Sub-legenda do nó: empresa/parente mostram o tipo; dados pessoais viraram balões `attr`
  const subOf = n => {
    if (n.type === 'empresa') {
      const parts = ['empresa'];
      if (n.label && String(n.label) !== String(n.cnpj)) parts.push(n.label);
      return parts.join(' · ');
    }
    if (n.type === 'parente') return n.prob != null ? ('parente · ' + n.prob + '%') : 'parente';
    // renda/score/nascimento/etc. viraram balões `attr` — a pessoa fica só com o nome
    if (n.type === 'attr') return '';
    if (n.type !== 'pessoa') return '';
    return isSeed(n.id) ? 'pessoa' : 'parente';
  };
  const els = [];
  (g.nodes || []).forEach(n => {
    const sub = subOf(n);
    const title = (n.type === 'empresa' && n.cnpj) ? fmtCnpj(n.cnpj) : n.label;
    els.push({ data: {
      id: n.id, label: title + (sub ? '\n' + sub : ''), type: n.type,
      cpf: n.cpf || '', nome: n.nome || '',
      chave: n.chave || '', rotulo: n.rotulo || '', valor: n.valor || '' } });
  });
  (g.edges || []).forEach(e => els.push({ data: {
    id: e.source + '→' + e.target + ':' + e.label, source: e.source, target: e.target, label: e.label } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: D('cy'),
    elements: els,
    minZoom: 0.15,
    maxZoom: 3,
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'font-size': 9, 'color': '#c9c9d8',
        'text-valign': 'bottom', 'text-margin-y': 6,
        'text-wrap': 'wrap', 'text-max-width': 96,
        'border-width': 1, 'border-color': 'rgba(0,0,0,0.35)' } },
      { selector: 'node[type = "pessoa"]', style: {
        'background-color': '#7d3fd1', 'shape': 'ellipse', 'width': 24, 'height': 24 } },
      { selector: 'node[type = "empresa"]', style: {
        'background-color': '#4a4a5e', 'shape': 'round-rectangle', 'width': 18, 'height': 18 } },
      { selector: 'node[type = "parente"]', style: {
        'background-color': '#9b8cc2', 'shape': 'diamond', 'width': 20, 'height': 20 } },
      { selector: 'node[type = "attr"]', style: {
        'background-color': '#4fd1c5', 'shape': 'ellipse', 'width': 14, 'height': 14,
        'border-width': 1, 'border-color': '#7ce7dc', 'font-size': 8,
        'text-margin-y': 5 } },
      { selector: 'node[cpf = "' + g.seed + '"]', style: {
        'background-color': '#c08bff', 'border-width': 3, 'border-color': '#e0c4ff' } },
      { selector: 'edge', style: {
        'width': 1.2, 'line-color': '#3c3c4e', 'curve-style': 'bezier',
        'target-arrow-shape': 'triangle', 'target-arrow-color': '#3c3c4e',
        'label': 'data(label)', 'font-size': 9, 'color': '#d8d8e4',
        'text-rotation': 'autorotate', 'text-background-color': '#1a1a22',
        'text-background-opacity': 0.92, 'text-background-padding': 3 } },
      { selector: ':selected', style: {
        'border-width': 2, 'border-color': '#f0c8ff' } }
    ],
    layout: { name: 'breadthfirst', roots: '[id = "cpf:' + g.seed + '"]',
              directed: false, spacingFactor: 1.15, padding: 26 }
  });
  cy.on('tap', 'node', evt => {
    const id = evt.target.id();
    const rec = nodeById(g, id);
    if (!rec) return;
    if (rec.type === 'pessoa') showFicha(rec);
    else if (rec.type === 'parente') showParente(rec);
    else if (rec.type === 'attr') showAttr(rec);
    else showEmpresa(rec);
  });
}

function toggleFicha(btn) {
  const box = btn.previousElementSibling;
  const collapsed = box.classList.toggle('collapsed');
  const n = box.querySelectorAll('.ficha-more').length;
  btn.textContent = collapsed ? 'ver +' + n : 'ocultar';
}

function showFicha(n) {
  const v = x => (x == null || x === '') ? '—' : x;
  const moeda = x => (x != null && x !== '') ? 'R$ ' + Number(x).toLocaleString('pt-BR') : '—';
  const sec = (t, corpo) => '<div class="ficha-sec">' + t + '</div>' + corpo;
  const lista = (items, fmt, lim) => {
    lim = lim || 12;
    if (!items || !items.length) return '<div class="ficha-empty">—</div>';
    const li = (x, extra) => '<li' + (extra ? ' class="ficha-more"' : '') + '>' + x + '</li>';
    if (items.length <= lim)
      return '<ul class="ficha-list">' + items.map(fmt).map(x => li(x, false)).join('') + '</ul>';
    const head = items.slice(0, lim).map(fmt).map(x => li(x, false)).join('');
    const rest = items.slice(lim).map(fmt).map(x => li(x, true)).join('');
    return '<ul class="ficha-list collapsed">' + head + rest + '</ul>'
      + '<button class="ficha-toggle" type="button" onclick="toggleFicha(this)">ver +' + (items.length - lim) + '</button>';
  };
  const fmtCnpj = c => { const s = String(c || ''); return s.length === 14 ? s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : s; };
  const empPeriodos = e => [['ADMISSAO','DEMISSAO'],['ADMISSAO_1','DEMISSAO_1'],['ADMISSAO_2','DEMISSAO_2']]
    .map(([a,d]) => (e[a] || e[d]) ? (e[a] || '?') + ' → ' + (e[d] || 'aberto') : null)
    .filter(Boolean).join(' · ');
  const fmtVal = (k, val) => {
    if (val && typeof val === 'object') return JSON.stringify(val);
    const s = String(val);
    if (/^CPF$/i.test(k) && s.length === 11) return fmtCpf(s);
    if (/^CNPJ$/i.test(k) && s.length === 14) return fmtCnpj(s);
    return s;
  };
  // Renderiza listas de objetos de forma genérica: cada campo vira uma linha,
  // sem assumir a forma exata da seção (funciona p/ empresas, bancos, PIX, vínculos).
  const listaObj = (items, lim) => {
    lim = lim || 5;
    if (!items || !items.length) return '<div class="ficha-empty">—</div>';
    const render = (obj, extra) => {
      const inner = (obj && typeof obj === 'object')
        ? Object.entries(obj)
            .filter(([, val]) => val != null && val !== '')
            .map(([k, val]) => '<div class="ficha-row"><span class="ficha-k">' + esc(k) + '</span><span class="ficha-v">' + esc(fmtVal(k, val)) + '</span></div>')
            .join('')
        : '<div class="ficha-row"><span class="ficha-k">—</span><span class="ficha-v">' + esc(String(obj)) + '</span></div>';
      return '<div class="ficha-obj' + (extra ? ' ficha-more' : '') + '">' + inner + '</div>';
    };
    if (items.length <= lim)
      return '<div class="ficha-objlist">' + items.map(o => render(o, false)).join('') + '</div>';
    const head = items.slice(0, lim).map(o => render(o, false)).join('');
    const rest = items.slice(lim).map(o => render(o, true)).join('');
    return '<div class="ficha-objlist collapsed">' + head + rest + '</div>'
      + '<button class="ficha-toggle" type="button" onclick="toggleFicha(this)">ver +' + (items.length - lim) + '</button>';
  };

  const fmtAtualizado = ts => {
    if (!ts) return '—';
    const d = new Date(ts * 1000);
    const dias = Math.floor((Date.now() / 1000 - ts) / 86400);
    const data = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const ago = dias <= 0 ? 'hoje' : (dias === 1 ? 'ontem' : dias + 'd atrás');
    return data + ' · ' + ago + (dias > 21 ? ' · desatualizado' : '');
  };

  const rows = [
    ['NOME', v(n.nome)], ['CPF', fmtCpf(n.cpf)], ['ATUALIZADO', fmtAtualizado(n.updated_at)], ['NASCIMENTO', v(n.nascimento)],
    ['SEXO', v(n.sexo)], ['MÃE', v(n.nome_mae)], ['PAI', v(n.nome_pai)],
    ['MUNICÍPIO', v(n.municipio)], ['RAÇA', v(n.raca)], ['TIPO SANGUÍNEO', v(n.tipo_sanguineo)],
    ['RG', v(n.rg)], ['ESTADO CIVIL', v(n.estado_civil)], ['ÓBITO', v(n.obito)],
    ['STATUS RECEITA', v(n.status_receita)], ['RECEBE INSS', v(n.recebe_inss)],
    ['PIS', v(n.pis)], ['NIS', v(n.nis)], ['CNS', v(n.cns)],
    ['CLASSE SOCIAL', v(n.classe_social)], ['ESCOLARIDADE', v(n.escolaridade)],
    ['PROFISSÃO', v(n.profissao)], ['RENDA', moeda(n.renda)], ['SCORE', v(n.score)]
  ];

  let html = '<div class="ficha-head">'
    + '<div class="ficha-name">' + esc(n.nome || n.label) + '</div>'
    + '<div class="ficha-sub">' + fmtCpf(n.cpf) + ' · ' + (n.parentes_qtd || 0) + ' parentes · ' + (n.empregos_qtd || 0) + ' empregos</div>'
    + '</div><div class="ficha-body">';
  rows.forEach(([k, val]) => {
    html += '<div class="ficha-row"><span class="ficha-k">' + k + '</span><span class="ficha-v">' + esc(val) + '</span></div>';
  });

  const oc = n.origem_cpf || {};
  if (oc.DIGITO_REGIAO || oc.REGIAO_FISCAL) {
    const est = (oc.ESTADOS_POSSIVEIS || []).join(', ');
    html += sec('ORIGEM CPF',
      '<div class="ficha-row"><span class="ficha-k">REGIÃO</span><span class="ficha-v">' + esc(oc.REGIAO_FISCAL || oc.DIGITO_REGIAO) + '</span></div>'
      + (est ? '<div class="ficha-row"><span class="ficha-k">ESTADOS</span><span class="ficha-v">' + esc(est) + '</span></div>' : ''));
  }
  const te = n.titulo_eleitor || {};
  if (te.NUMERO || te.ZONA || te.SECAO) {
    html += sec('TÍTULO ELEITOR',
      '<div class="ficha-row"><span class="ficha-k">Nº</span><span class="ficha-v">' + esc(te.NUMERO || '—') + '</span></div>'
      + '<div class="ficha-row"><span class="ficha-k">ZONA</span><span class="ficha-v">' + esc(te.ZONA || '—') + '</span></div>'
      + '<div class="ficha-row"><span class="ficha-k">SEÇÃO</span><span class="ficha-v">' + esc(te.SECAO || '—') + '</span></div>');
  }

  html += sec('E-MAILS (' + (n.emails || []).length + ')', lista(n.emails, e => esc(e)));
  html += sec('TELEFONES (' + (n.telefones || []).length + ')',
    lista(n.telefones, t => esc(t.TELEFONE) + (t.WHATSAPP ? ' · wpp' : '')));
  html += sec('ENDEREÇOS (' + (n.enderecos || []).length + ')',
    lista(n.enderecos, e => esc([e.LOGRADOURO, e.BAIRRO, e.CIDADE, e.UF].filter(Boolean).join(', ')), 8));
  html += sec('EMPRESAS (' + (n.empresas || []).length + ')',
    listaObj(n.empresas, 10));

  const emps = n.empregos || [];
  html += sec('EMPREGOS (' + emps.length + ')',
    emps.length
      ? '<ul class="ficha-list">' + emps.slice(0, 20).map(e =>
          '<li>' + esc([e.razao_social || e.RAZAO_SOCIAL, fmtCnpj(e.cnpj)].filter(Boolean).join(' · '))
          + (empPeriodos(e) ? '<br>' + esc(empPeriodos(e)) : '') + '</li>').join('')
        + (emps.length > 20 ? '<li>… +' + (emps.length - 20) + '</li>' : '') + '</ul>'
      : '<div class="ficha-empty">—</div>');

  html += sec('BANCOS (' + (n.bancos || []).length + ')',
    listaObj(n.bancos, 10));
  html += sec('CHAVES PIX (' + (n.chaves_pix || []).length + ')',
    listaObj(n.chaves_pix, 10));
  html += sec('VÍNCULOS TRABALHISTAS (' + (n.vinculos_trabalhistas || []).length + ')',
    listaObj(n.vinculos_trabalhistas, 5));

  const ir = n.indicadores_renda || {};
  if (Object.keys(ir).length) {
    const rais = ir.RAIS || {};
    html += sec('RENDA',
      '<div class="ficha-row"><span class="ficha-k">ATUAL</span><span class="ficha-v">' + moeda(ir.RENDA_ATUAL) + '</span></div>'
      + '<div class="ficha-row"><span class="ficha-k">FONTE</span><span class="ficha-v">' + esc(ir.FONTE_RENDA || '—') + '</span></div>'
      + (rais.QTD_VINCULOS != null ? '<div class="ficha-row"><span class="ficha-k">RAIS VÍNC.</span><span class="ficha-v">' + esc(rais.QTD_VINCULOS) + '</span></div>' : ''));
  }

  html += sec('VEÍCULOS (' + (n.veiculos || []).length + ')',
    lista(n.veiculos, e => esc([e.MODELO, e.ANO].filter(Boolean).join(' — ')), 10));
  html += sec('HISTÓRICO VEICULAR (' + (n.historico_veicular || []).length + ')',
    lista(n.historico_veicular, e => esc([e.PLACA, e.ANO].filter(Boolean).join(' — ')), 10));

  const ints = Object.entries(n.interesses || {}).filter(([, b]) => b).map(([k]) => k);
  html += sec('INTERESSES (' + ints.length + ')',
    ints.length
      ? '<ul class="ficha-list">' + ints.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul>'
      : '<div class="ficha-empty">—</div>');

  const da = n.divida_ativa || {};
  html += sec('DÍVIDA ATIVA',
    '<div class="ficha-row"><span class="ficha-k">POSSUI</span><span class="ficha-v">'
      + esc(da.POSSUI === true ? 'SIM' : (da.POSSUI === false ? 'NÃO' : '—')) + '</span></div>'
    + (da.QTD != null ? '<div class="ficha-row"><span class="ficha-k">QTD</span><span class="ficha-v">' + esc(da.QTD) + '</span></div>' : '')
    + (da.CONFIANCA != null ? '<div class="ficha-row"><span class="ficha-k">CONFIANÇA</span><span class="ficha-v">' + esc(da.CONFIANCA) + '</span></div>' : '')
    + (da.CANDIDATOS_NAO_CONFIRMADOS != null ? '<div class="ficha-row"><span class="ficha-k">CAND. NÃO CONF.</span><span class="ficha-v">' + esc(da.CANDIDATOS_NAO_CONFIRMADOS) + '</span></div>' : ''));

  if (CPF_GRAPH && n.cpf === CPF_GRAPH.seed) {
    html += vinculoBlockCpf(n.cpf);
  }

  html += '</div>';
  D('ficha').innerHTML = html;
}

function showAttr(n) {
  const v = x => (x == null || x === '') ? '—' : x;
  D('ficha').innerHTML =
    '<div class="ficha-head">'
    + '<div class="ficha-name">' + esc(n.rotulo || n.chave || 'dado') + '</div>'
    + '<div class="ficha-sub">atributo · ' + (n.cpf ? fmtCpf(n.cpf) : '—') + '</div>'
    + '</div><div class="ficha-body">'
    + '<div class="ficha-row"><span class="ficha-k">VALOR</span><span class="ficha-v">' + esc(v(n.valor)) + '</span></div>'
    + '</div>';
}

function showParente(n) {
  const cands = n.candidatos || [];
  const top = cands[0] || {};
  const cpf = n.cpf || top.cpf || '';
  const prob = n.prob != null ? n.prob : top.prob;
  let html = '<div class="ficha-head">'
    + '<div class="ficha-name">' + esc(n.label || n.nome) + '</div>'
    + '<div class="ficha-sub">parente · ' + (cpf ? fmtCpf(cpf) : 'sem CPF') + '</div>'
    + '</div><div class="ficha-body">'
    + '<div class="ficha-row"><span class="ficha-k">VÍNCULO</span><span class="ficha-v">' + esc(n.tipo || '—') + '</span></div>';
  if (cpf) {
    html += '<div class="ficha-row"><span class="ficha-k">CPF</span><span class="ficha-v">' + fmtCpf(cpf) + '</span></div>'
      + '<div class="ficha-row"><span class="ficha-k">PROBABILIDADE</span><span class="ficha-v">' + (prob != null ? prob + '%' : '—') + '</span></div>';
  } else {
    html += '<div class="ficha-row"><span class="ficha-k">CPF</span><span class="ficha-v">não informado</span></div>';
  }
  if (cands.length > 1) {
    html += '<div class="ficha-sec">CANDIDATOS (' + cands.length + ')</div><ul class="ficha-list">';
    cands.forEach(c => {
      html += '<li>' + esc(c.nome || '') + ' <span class="ficha-k">' + (c.prob != null ? c.prob + '%' : '—') + '</span>'
        + ' · ' + fmtCpf(c.cpf) + '</li>';
    });
    html += '</ul>';
  }
  html += '</div>';
  D('ficha').innerHTML = html;
}

function showEmpresa(n) {
  let html = '<div class="ficha-head">'
    + '<div class="ficha-name">' + esc(n.label || n.cnpj) + '</div>'
    + '<div class="ficha-sub">empresa</div>'
    + '</div><div class="ficha-body">'
    + '<div class="ficha-row"><span class="ficha-k">CNPJ</span><span class="ficha-v">' + esc(n.cnpj) + '</span></div>'
    + '</div>';
  D('ficha').innerHTML = html;
}

// ── Scramble de caracteres (alma terminal) ──────────────
const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@!$%&*[]{}|/\\<>=+~^';
const SCRAMBLE_CHARS_SM = 'abcdefghijklmnopqrstuvwxyz0123456789#@!$%&*<>[]|=+';

function randChar(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

// Logo: scramble periódico — caracteres revelados progressivamente
(function initLogoScramble() {
  if (REDUCED) return;
  const el = document.querySelector('.logo-text');
  const original = 'VAULTGREP';

  function scramble() {
    let step = 0;
    const steps = 14;
    const id = setInterval(() => {
      step++;
      const progress = step / steps;
      el.textContent = original.split('').map((ch, i) =>
        Math.random() < progress ? ch : randChar(SCRAMBLE_CHARS)
      ).join('');
      if (step >= steps) {
        clearInterval(id);
        el.textContent = original;
        setTimeout(scramble, 5000 + Math.random() * 4000);
      }
    }, 45);
  }

  setTimeout(scramble, 1500 + Math.random() * 1500);
})();

// Streaming word: 1-2 caracteres trocando rapidamente enquanto ativo
if (!REDUCED) {
  setInterval(() => {
    const el = document.querySelector('.streaming-word');
    if (!el) return;
    const orig = 'streaming…';
    const chars = orig.split('');
    // Só troca nos 9 chars alfabéticos, não na reticência
    const i = Math.floor(Math.random() * 9);
    chars[i] = randChar(SCRAMBLE_CHARS_SM);
    if (Math.random() > 0.6) {
      const j = Math.floor(Math.random() * 9);
      chars[j] = randChar(SCRAMBLE_CHARS_SM);
    }
    el.textContent = chars.join('');
    setTimeout(() => {
      const el2 = document.querySelector('.streaming-word');
      if (el2) el2.textContent = orig;
    }, 70);
  }, 120);
}

// ── Rota por hash: F5 volta pra aba atual ─────────────
(function initRoute() {
  const valid = ['grep', 'cat', 'cpf', 'ollama', 'email'];
  const h = (location.hash || '').replace('#', '');
  if (valid.includes(h) && h !== 'grep') sw(h);
  else if (!valid.includes(h)) history.replaceState(null, '', '#grep');
})();

const MODE_FEATURE = { grep: 'grep', cat: 'cat', cpf: 'cpf', email: 'email', ollama: null };
async function refreshFeatures() {
  const pill = D('pill');
  const label = D('pill-label');
  if (!pill || !label) return;
  const fk = MODE_FEATURE[mode];
  if (fk === null) {
    pill.classList.remove('offline');
    pill.title = 'ollama sempre ativo';
    label.textContent = 'ONLINE';
    return;
  }
  try {
    const r = await fetch('/features');
    if (!r.ok) return;
    const feats = (await r.json()).features || {};
    const on = feats[fk] !== false;
    pill.classList.toggle('offline', !on);
    pill.title = fk + (on ? ' online' : ' desativado');
    label.textContent = on ? 'ONLINE' : 'OFFLINE';
  } catch (e) { /* mantém estado atual */ }
}
refreshFeatures();
setInterval(refreshFeatures, 30000);
</script>
