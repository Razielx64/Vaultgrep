services:
  grep-cat:
    build: .
    container_name: grep-cat
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      CACHE_DB: "/data/search_cache.db"
      USERNAME_VAULT: ${USERNAME_VAULT:-}
      PASSWORD_VAULT: ${PASSWORD_VAULT:-}
    volumes:
      - ./dbs:/app/dbs:ro
      - ./frontend:/app/frontend:ro
      - cache_data:/data
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  cache_data:
