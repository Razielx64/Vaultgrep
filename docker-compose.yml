services:
  grep-cat:
    build: .
    container_name: grep-cat
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8082"
      CACHE_DB: "/data/search_cache.db"
      GRAPH_DB: "/data/vault_graph.db"
      OLLAMA_DB: "/data/ollama.db"
      USERNAME_VAULT: ${USERNAME_VAULT:-}
      PASSWORD_VAULT: ${PASSWORD_VAULT:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      QUERYBUSCAS_USER: ${QUERYBUSCAS_USER:-}
      QUERYBUSCAS_PASS: ${QUERYBUSCAS_PASS:-}
      CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY:-}
      EMAIL_DB: "/data/email_cache.db"
      EMAIL_WORKER_URL: ${EMAIL_WORKER_URL:-}
      EMAIL_WORKER_TIMEOUT: ${EMAIL_WORKER_TIMEOUT:-180}
      AWS_ACCESS: ${AWS_ACCESS:-}
      AWS_SECRET: ${AWS_SECRET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./dbs:/app/dbs:ro
      - ./frontend:/app/frontend:ro
      - ./data:/data
    ports:
      - "0.0.0.0:8082:8082"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
